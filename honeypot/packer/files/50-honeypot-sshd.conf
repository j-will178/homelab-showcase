# The real SSH server. Ports 22/23 belong to Cowrie (nftables redirects them).
# 47022 is only reachable from the bastion (cloud firewall + nftables).
Port 47022
HostKey /etc/ssh/ssh_host_ed25519_key
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers collector hpadmin
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 30

# optiplex-management's key: it can only run the log reader, nothing else.
Match User collector
    ForceCommand /usr/local/bin/hp-log-read
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
