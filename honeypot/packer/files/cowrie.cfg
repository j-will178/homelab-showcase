# Cowrie 3.1.x overrides. Everything not set here comes from the cowrie.cfg.dist bundled
# with the pinned Cowrie package (see requirements.txt).

[honeypot]
# What attackers see. Keep it boring and believable.
hostname = app01
sensor_name = honeypot
log_path = /var/lib/cowrie/log
state_path = /var/lib/cowrie/state
download_path = /var/lib/cowrie/downloads
etc_path = /etc/cowrie
timezone = UTC
# The VM has no outbound access, so nothing can be fetched; keep any partial writes small.
download_limit_size = 10485760

[ssh]
enabled = true
# Unprivileged ports; nftables redirects 22 -> 2222 and 23 -> 2223.
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# The only output: one JSON object per line, rotated daily by Cowrie.
# cloud-ops reads it through hp-log-read (see README).
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
