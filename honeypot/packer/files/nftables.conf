#!/usr/sbin/nft -f
# Honeypot host firewall. The DigitalOcean cloud firewall (outside this VM) enforces the
# same rules; this is the second layer, and it logs anything that got past the first.
flush ruleset

table inet honeypot {
    # set at boot by cloud-init (/etc/nftables.d/bastion.nft): the bastion's address
    set bastion { type ipv4_addr; }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        tcp dport 22 redirect to :2222
        tcp dport 23 redirect to :2223
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iif lo accept
        tcp dport { 2222, 2223 } accept
        ip saddr @bastion tcp dport 47022 accept
        limit rate 10/minute log prefix "hp-drop-in: " level info
    }

    chain output {
        type filter hook output priority filter; policy drop;
        ct state established,related accept
        oif lo accept
        # DigitalOcean metadata service (cloud-init reads its user data at first boot)
        ip daddr 169.254.169.254 tcp dport 80 accept
        # Anything else is a new outbound connection from the honeypot: never allowed, always logged.
        limit rate 10/minute log prefix "hp-drop-out: " level warn
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}

include "/etc/nftables.d/*.nft"
