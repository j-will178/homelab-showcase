# OPNsense configd action: lets the GUI cron (System > Settings > Cron) run the SMART agent.
# Installed by install-opnsense.sh (which fills in the dashboard URL). run.sh updates the
# agent from GitHub, then runs it.
[smart-push]
command:/bin/sh /usr/local/rack-agent/run.sh --url DASHBOARD_URL --token-file /usr/local/rack-agent/token --name opnsense
parameters:
type:script_output
message:Pushing SMART report to rack dashboard
description:Push SMART report to rack dashboard
