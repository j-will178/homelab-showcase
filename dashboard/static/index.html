<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homelab</title>
<!-- / is only a signpost. Old dashboard links always carried options (?projection=robinson,
     ?screen=honeypot...), so a query string means the rack dashboard; a bare / means the home page.
     Plain JS rather than a server redirect so the static demo (GitHub Pages) behaves the same. -->
<script>
  location.replace((location.search ? 'rack/' : 'home/') + location.search + location.hash);
</script>
</head>
<body>
<noscript><p><a href="home/">Home</a> · <a href="rack/">Rack dashboard</a></p></noscript>
</body>
</html>
